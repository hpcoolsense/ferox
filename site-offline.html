<!DOCTYPE html>
<!-- FEROX-SITE-OFFLINE -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FEROX — Sitio temporalmente fuera de servicio</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(900px 500px at 50% -10%, #2a1a0a 0%, transparent 60%),
        linear-gradient(160deg, #0a0a0a 0%, #141414 50%, #000 100%);
      color: #b8b8b8;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 540px; }
    .logo { height: 56px; width: auto; margin: 0 auto 2.5rem; display: block; opacity: 0.95; }
    .tag {
      font-size: 0.72rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #c4541d;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 600;
      color: #f5f5f5;
      line-height: 1.2;
      margin-bottom: 1.25rem;
      letter-spacing: 0.01em;
    }
    p { font-size: 1rem; line-height: 1.7; color: #9a9a9a; }
    .divider {
      width: 48px; height: 2px;
      background: linear-gradient(90deg, #6b2a0a, #f59542);
      margin: 2rem auto;
      border-radius: 2px;
    }
    .foot {
      margin-top: 2.5rem;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      color: #5a5a5a;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="logo-ferox-white.png" alt="FEROX"
         onerror="this.style.display='none'">
    <div class="tag">Aviso</div>
    <h1>Sitio temporalmente fuera de servicio</h1>
    <div class="divider"></div>
    <p>Estamos realizando tareas de mantenimiento. El sitio volverá a estar disponible a la brevedad.</p>
    <div class="foot">FEROX — Industrial Metals &amp; Components</div>
  </main>
</body>
</html>
